name: Build Pulse Visuals

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check fixed JAR
        shell: bash
        run: |
          set -e
          test -f "PulseVisualsMod-1.21.11-fixed.jar"
          echo "Using fixed JAR"

      - name: Prepare JAR
        shell: bash
        run: |
          set -e
          cp "PulseVisualsMod-1.21.11-fixed.jar" "PulseVisualsMod-1.21.11.jar"

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: PulseVisualsMod-1.21.11
          path: PulseVisualsMod-1.21.11.jar
          if-no-files-found: error
