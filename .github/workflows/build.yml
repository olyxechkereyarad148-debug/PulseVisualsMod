name: Build Pulse Visuals

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        shell: bash
        run: |
          set -e

          ZIP="$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)"

          if [ -z "$ZIP" ]; then
            echo "ZIP project not found"
            exit 1
          fi

          echo "Found: $ZIP"

          mkdir -p /tmp/pulse
          unzip -q "$ZIP" -d /tmp/pulse

          echo "Extracted files:"
          find /tmp/pulse -maxdepth 3 -type f | head -100

          ROOT="$(find /tmp/pulse -mindepth 1 -maxdepth 1 -type d | head -n 1)"

          if [ -n "$ROOT" ] && [ -f "$ROOT/build.gradle" -o -f "$ROOT/build.gradle.kts" -o -f "$ROOT/gradlew" ]; then
            cp -a "$ROOT"/. .
          else
            cp -a /tmp/pulse/. .
          fi

          echo "Project files:"
          ls -la

      - name: Detect Gradle project
        shell: bash
        run: |
          set -e

          if [ -f "build.gradle" ] || [ -f "build.gradle.kts" ] || [ -f "gradlew" ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          elif [ -f "main/build.gradle" ] || [ -f "main/build.gradle.kts" ] || [ -f "main/gradlew" ]; then
            echo "PROJECT_DIR=main" >> "$GITHUB_ENV"
          else
            echo "Gradle project not found!"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.1"

      - name: Build mod
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew build --no-daemon
          else
            gradle build --no-daemon
          fi

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: PulseVisualsMod-1.21.11
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error
