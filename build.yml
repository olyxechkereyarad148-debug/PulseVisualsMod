name: Build Pulse Visuals

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)"
          if [ -z "$ZIP" ]; then
            echo "ZIP project not found"
            exit 1
          fi

          rm -rf /tmp/pulse
          mkdir -p /tmp/pulse
          unzip -q "$ZIP" -d /tmp/pulse

          if [ -f /tmp/pulse/build.gradle ] || [ -f /tmp/pulse/build.gradle.kts ]; then
            cp -a /tmp/pulse/. .
          else
            ROOT="$(find /tmp/pulse -mindepth 1 -maxdepth 1 -type d | head -n 1)"
            if [ -z "$ROOT" ]; then
              echo "Could not find extracted Gradle project"
              exit 1
            fi
            cp -a "$ROOT"/. .
          fi

          echo "Project root:"
          ls -la

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.1"

      - name: Build mod
        shell: bash
        run: gradle build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: PulseVisualsMod-1.21.11
          path: build/libs/*.jar
          if-no-files-found: error
