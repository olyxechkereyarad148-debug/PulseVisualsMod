name: Build Pulse Visuals

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build from source
        run: gradle clean build --no-daemon --stacktrace

      - name: Verify remapped JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR='build/libs/pulsevisuals-1.1.1.jar'
          test -f "$JAR"
          echo "Built: $JAR"
          unzip -t "$JAR" >/dev/null
          if unzip -l "$JAR" | grep -q 'pulsevisuals.mixins.json'; then
            echo 'ERROR: stale mixin configuration found'
            exit 1
          fi

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: PulseVisualsMod-1.21.11
          path: build/libs/pulsevisuals-1.1.1.jar
          if-no-files-found: error
